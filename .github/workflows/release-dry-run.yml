name: Release dry run

# Builds everything a release would, without signing or publishing, whenever
# a PR touches packaging, so a broken release is caught before merging.
on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/**'

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gpgv lintian >/dev/null
      - run: npm ci --ignore-scripts && npm run build
      - name: Tarball and .debs for every CPU
        run: |
          sh packaging/build-tarball.sh 0.0.0-dry out
          for arch in armhf arm64 amd64; do
            sh packaging/build-deb.sh 0.0.0-dry "$arch" out/pipulse-0.0.0-dry.tar.gz out
            lintian --fail-on error "out/pipulse_0.0.0-dry_${arch}.deb"
          done
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          build-args: VERSION=0.0.0-dry
