name: Release dry run

# Builds everything a release would, without signing or publishing, whenever
# a PR touches packaging, so a broken release is caught before merging.
on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/**'

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gpgv lintian >/dev/null
      - run: npm ci && npm run build
      - name: Tarball and .debs for every CPU
        run: |
          sh packaging/build-tarball.sh 0.0.0-dry out
          for arch in armhf arm64 amd64; do
            sh packaging/build-deb.sh 0.0.0-dry "$arch" out/pipulse-0.0.0-dry.tar.gz out
            lintian --fail-on error "out/pipulse_0.0.0-dry_${arch}.deb"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          build-args: VERSION=0.0.0-dry
