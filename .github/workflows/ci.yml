name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck the packaging scripts
        run: shellcheck packaging/*.sh packaging/pipulse packaging/deb/preinst packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm packaging/test/*.sh

  packaging:
    # Installs, upgrades, rolls back and removes PiPulse in a clean Debian container.
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v7
      - name: Tools the tests need
        run: apt-get update -qq && apt-get install -y -qq gpgv curl xz-utils ca-certificates adduser iproute2 procps python3 lintian gnupg apt-utils >/dev/null
      - run: npm ci
      - run: npm run build
      - name: Packaging tests
        run: sh packaging/test/run.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pipulse:test
          build-args: VERSION=0.0.0-ci
      - name: compose.yaml is valid
        run: docker compose -f compose.yaml config -q
      - name: Smoke test (healthy, firmware plugins unavailable)
        run: sh packaging/test/docker.sh pipulse:test
