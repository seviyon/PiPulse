name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shellcheck the packaging scripts
        run: shellcheck packaging/*.sh packaging/pipulse packaging/deb/preinst packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm packaging/test/*.sh

  packaging:
    # Installs, upgrades, rolls back and removes PiPulse in a clean Debian container.
    runs-on: ubuntu-24.04
    container:
      image: node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
      # The image is pulled before any step runs, so it logs in here (see the docker job).
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tools the tests need
        run: apt-get update -qq && apt-get install -y -qq gpgv curl xz-utils ca-certificates adduser iproute2 procps python3 lintian gnupg apt-utils openssl strace systemd >/dev/null
      - run: npm ci
      - run: npm run build
      - name: Packaging tests
        run: sh packaging/test/run.sh

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Probe Docker Hub (temporary, removed once the cause is known)
        continue-on-error: true
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          url='https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/node:pull'
          for i in 1 2 3; do
            curl -sS -m 25 -o /dev/null -w "anonymous     %{http_code} %{time_total}s\n" "$url" || echo "anonymous     failed"
            curl -sS -m 25 -o /dev/null -w "authenticated %{http_code} %{time_total}s\n" -u "$DH_USER:$DH_TOKEN" "$url" || echo "authenticated failed"
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          # Docker Hub: anonymous pulls share a per-address limit that the runners often exhaust.
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: pipulse:test
          build-args: VERSION=0.0.0-ci
      - name: compose.yaml is valid
        run: docker compose -f compose.yaml config -q
      - name: Smoke test (healthy, firmware plugins unavailable)
        run: sh packaging/test/docker.sh pipulse:test
      - name: Compose (sidecar, volumes, capabilities)
        run: sh packaging/test/compose.sh pipulse:test
      - name: Compose with an operator certificate
        run: sh packaging/test/compose-operator.sh pipulse:test
