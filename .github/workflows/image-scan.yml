name: Image scan

# Looks for known vulnerabilities in the image people run (the one compose.yaml pulls), for both
# CPUs, on the 1st of every month, right after each release is published, and on demand. It is
# not a pull request check, so it never blocks a merge; it fails, and GitHub tells you, when a
# HIGH or CRITICAL finding already has a fix. Most come from the Debian base image and clear with
# the next release (the Dockerfile upgrades Debian's packages when it builds).
on:
  schedule:
    - cron: '23 5 1 * *'
  # A new release is a new image: check it when it is out. The Release workflow also runs (and
  # skips every job) for a merged pull request without a release label; only a run that
  # succeeded published an image.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/seviyon/pipulse:latest
    steps:
      - name: Scan the published image
        run: |
          failed=0
          for platform in linux/arm64 linux/amd64; do
            # Trivy pulls the image from the registry itself; --exit-code 1 on findings, so the
            # report is written before the step is marked failed.
            docker run --rm -v trivy-cache:/root/.cache \
              aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
              image --platform "$platform" --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --quiet --format table "$IMAGE" > "scan.txt" || failed=1
            {
              echo "### $IMAGE ($platform)"
              echo
              echo '```'
              cat scan.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat scan.txt
          done
          exit "$failed"
