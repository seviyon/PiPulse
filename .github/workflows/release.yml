name: Release

# A PR merged into main with a release:patch|minor|major label (or a manual run
# with a version) builds and publishes a release. The job that holds the apt
# signing key never runs npm or any dependency's code: building and testing
# happen in jobs without secrets or write access, and hand over only files.

on:
  # push to main, not pull_request or pull_request_target: GitHub's default policy for
  # pull_request_target (enforced from 2026-12-02) blocks it in public repositories, and a plain
  # pull_request run reports the PR's own branch (renovate/...) to the release environment's
  # branch rule, which refuses it. A push to main runs on main, which is what that rule checks.
  # `version` finds the PR merged as the pushed commit and reads its labels; a push that is no
  # merged PR, or whose PR has no release label, ends there.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (plain X.Y.Z, e.g. 0.6.1)'
        required: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # The pushed commit itself, even if main moved on since.
          ref: ${{ github.sha }}
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT" ]; then v=$INPUT; else
            # Fetched on its own line: if the API call fails the step fails, instead of reading as "no release".
            pulls=$(gh api "repos/$REPO/commits/$SHA/pulls")
            bump=$(printf '%s' "$pulls" | sh packaging/pr-bump.sh "$SHA")
            if [ -z "$bump" ]; then echo "not a merged PR with a release label: nothing to release"; exit 0; fi
            v=$(sh packaging/next-version.sh "$(git tag -l 'v*' --sort=-v:refname | head -n 1)" "$bump")
          fi
          sh packaging/next-version.sh --check "$v"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "v$v already exists"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    # No secrets, read-only token not kept in the checkout: npm and the build run here.
    # image, publish and verify need this job, so they are skipped with it when `version` found nothing to release.
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gpgv lintian >/dev/null
      - run: npm ci --ignore-scripts
      - name: Build and test
        env:
          # The dashboard stamps itself with the release it ships in (the page warns when it
          # no longer matches the server); build-tarball.sh refuses an unstamped one.
          PIPULSE_WEB_VERSION: ${{ needs.version.outputs.version }}
        run: npm test
      - name: Tarball and .debs
        env:
          V: ${{ needs.version.outputs.version }}
          PIPULSE_REQUIRE_WEB_VERSION: '1'
        run: |
          sh packaging/build-tarball.sh "$V" out
          for arch in armhf arm64 amd64; do
            sh packaging/build-deb.sh "$V" "$arch" "out/pipulse-$V.tar.gz" out
            # The units ship in /lib/systemd/system: Debian 11 (Raspberry Pi OS "bullseye", the Pi 2's
            # system) is not merged-/usr, so that is where its systemd reads them. lintian 2.129 (Ubuntu
            # 26.04) flags that as aliased-location; the older lintian of the packaging job (Debian
            # bookworm) does not know the tag and calls an override for it an error, so the tag is
            # suppressed here, on the newer lintian, and not in the package.
            lintian --fail-on error --suppress-tags aliased-location "out/pipulse_${V}_${arch}.deb"
          done
          sh packaging/stamp-installer.sh packaging/install.sh out/install.sh
          # The shipped compose file runs this release's image (the repository copy follows :latest).
          sh packaging/stamp-compose.sh compose.yaml out/compose.yaml "$V"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: out/
          if-no-files-found: error

  image:
    # Builds inside BuildKit containers; can push to GHCR but holds no signing key.
    needs: [version, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          # Docker Hub: anonymous pulls share a per-address limit that the runners often exhaust.
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          # :latest moves only once the release is published (see publish).
          tags: ghcr.io/seviyon/pipulse:${{ needs.version.outputs.version }}

  publish:
    # The only job with the signing key. It runs no npm and no project code:
    # it signs and publishes the files the build job made.
    needs: [version, build, image]
    runs-on: ubuntu-26.04
    # Secrets live in this environment, limited to main: no other branch can read the key.
    environment: release
    # Only this job changes shared state (gh-pages, the tag, :latest), so only it queues. A
    # workflow-wide lock made every push to main, released or not, compete for the one pending
    # slot, and a run that releases could be replaced by one that does not. GitHub keeps one pending
    # run per group: if two releases wait behind a third, the older one shows as cancelled; re-run it
    # with Run workflow and its version.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - name: The version is still free
        # `version` picked it before a release ahead of this one in the queue finished.
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "v$V was released while this run waited; re-run it with the next version"; exit 1; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils gpgv >/dev/null
      - name: Check what the build produced against the commit
        # The build job runs npm and the project's tooling; this step (no secrets) rebuilds from the
        # checkout what does not need them and refuses to go on if anything differs. `npm ci` here
        # uses --ignore-scripts and runs no dependency code. See packaging/verify-release.sh.
        env:
          V: ${{ needs.version.outputs.version }}
        run: sh packaging/verify-release.sh "$V" out
      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          # The installer trusts packaging/apt-key.gpg, so the key that signs must be that one: a
          # release signed by any other key would not verify for anybody who runs the installer.
          gpg --export | gpg --show-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}' > /tmp/signing-fpr
          gpg --show-keys --with-colons packaging/apt-key.gpg | awk -F: '/^fpr/ {print $10; exit}' > /tmp/committed-fpr
          cmp /tmp/signing-fpr /tmp/committed-fpr || { echo "the signing key is not the one in packaging/apt-key.gpg"; exit 1; }
      - name: Apt repository
        env:
          V: ${{ needs.version.outputs.version }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          git worktree add pages gh-pages 2>/dev/null || git worktree add --orphan -b gh-pages pages
          sh packaging/apt-publish.sh pages/apt 3 out/pipulse_"$V"_*.deb
          touch pages/.nojekyll # serve the apt files as they are
          # One fresh commit each release, force-pushed: git history would otherwise keep
          # every .deb ever published (each carries Node), growing the branch without end.
          cd pages
          git checkout -q --orphan pages-new
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "apt: pipulse $V"
          git push --force origin HEAD:gh-pages
      - name: Checksums
        env:
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          cd out && sha256sum pipulse-*.tar.gz pipulse_*.deb install.sh compose.yaml > SHA256SUMS
          printf '%s' "$APT_SIGNING_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 -abs -o SHA256SUMS.asc SHA256SUMS
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          gh release create "v$V" --target "$SHA" --title "PiPulse $V" --generate-notes \
            out/pipulse-"$V".tar.gz out/pipulse_"$V"_*.deb out/install.sh out/compose.yaml out/SHA256SUMS out/SHA256SUMS.asc
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move the image's :latest to this release
        env:
          V: ${{ needs.version.outputs.version }}
        run: docker buildx imagetools create -t ghcr.io/seviyon/pipulse:latest "ghcr.io/seviyon/pipulse:$V"

  verify:
    # What users get: install the new version from the apt repository, as the README says.
    needs: [version, publish]
    runs-on: ubuntu-26.04
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          # Docker Hub: anonymous pulls share a per-address limit that the runners often exhaust.
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install from the apt repository
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          # GitHub Pages publishes asynchronously: retry for up to 10 minutes.
          for i in $(seq 1 20); do
            curl -fsS "https://seviyon.github.io/PiPulse/apt/dists/stable/main/binary-amd64/Packages" 2>/dev/null | grep -q "^Version: $V$" && break
            echo "waiting for GitHub Pages ($i/20)"; sleep 30
          done
          docker run --rm debian:bookworm-slim sh -c "
            apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null &&
            curl -fsSL https://seviyon.github.io/PiPulse/apt/pipulse.gpg -o /usr/share/keyrings/pipulse.gpg &&
            echo 'deb [signed-by=/usr/share/keyrings/pipulse.gpg] https://seviyon.github.io/PiPulse/apt stable main' > /etc/apt/sources.list.d/pipulse.list &&
            apt-get update -qq && apt-get install -y -qq pipulse >/dev/null &&
            grep -q '\"$V\"' /opt/pipulse/app/version.json"
